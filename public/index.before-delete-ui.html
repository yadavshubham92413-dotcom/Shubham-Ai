<!doctype html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050608">
  <title>SHUBHAM AI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div id="splash">
    <div class="sa-logo">SA</div>
  </div>

  <div class="app">

    <header class="topbar">
      <button id="menuBtn" class="icon-btn" aria-label="Menu">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

      <div class="brand">SHUBHAM AI</div>

      <button id="newChatBtn" class="icon-btn" aria-label="New chat">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>

    <aside id="sideMenu" class="side-menu">
      <div class="menu-head">
        <strong>SHUBHAM AI</strong>
        <button id="closeMenu" class="icon-btn">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <button class="menu-action" id="menuNewChat">
        <span class="menu-icon">＋</span> New chat
      </button>

      <div class="menu-section">FEATURES</div>

      <button class="menu-item">ROBLOX SCRIPTING</button>
      <button class="menu-item">APP DEVELOPMENT</button>
      <button class="menu-item">CODING</button>
      <button class="menu-item">STUDY</button>
      <button class="menu-item">CALCULATOR</button>
      <button class="menu-item">WRITING</button>
      <button class="menu-item">WEB SEARCH</button>
      <button class="menu-item">IMAGE STUDIO</button>
      <button class="menu-item">VIDEO STUDIO</button>
      <button class="menu-item">DOCUMENTS</button>
      <button class="menu-item">DATA ANALYSIS</button>
      <button class="menu-item">TRANSLATOR</button>

      <div class="menu-section">CHATS</div>
      <div id="historyList" class="history-list"></div>

      <div class="menu-section">MORE</div>
      <button class="menu-item">MEMORY</button>
      <button class="menu-item">PROJECTS</button>
      <button class="menu-item">GALLERY</button>
      <button class="menu-item">SETTINGS</button>
    </aside>

    <main id="chatArea" class="chat-area">

      <section id="welcome" class="welcome">
        <h1>नमस्ते 👋</h1>
        <p>मैं आपकी क्या सेवा कर सकता हूँ?</p>

        <div class="suggestions">
          <button data-suggestion="कुछ नया सीखना है">💡 कुछ नया सीखना है</button>
          <button data-suggestion="कुछ लिखने में मदद चाहिए">✍️ कुछ लिखने में मदद चाहिए</button>
          <button data-suggestion="एक तस्वीर बनानी है">🖼️ एक तस्वीर बनानी है</button>
          <button data-suggestion="एक वीडियो बनाना है">🎬 एक वीडियो बनाना है</button>
        </div>
      </section>

      <section id="messages" class="messages"></section>

    </main>

    <div id="attachmentPreview" class="attachment-preview"></div>

    <footer class="composer-wrap">
      <div class="composer">

        <button id="fileBtn" class="composer-icon" aria-label="Files">
          <svg viewBox="0 0 24 24"><path d="M5 4h10l4 4v12H5z"/><path d="M15 4v5h4M8 13h8M8 17h6"/></svg>
        </button>

        <button id="photoBtn" class="composer-icon" aria-label="Gallery">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8" cy="9" r="1.5"/><path d="M4 17l5-5 3 3 2-2 6 5"/></svg>
        </button>

        <input id="fileInput" type="file" accept=".pdf,.txt,.md,.csv,.doc,.docx,.xlsx,.json" hidden>
        <input id="photoInput" type="file" accept="image/*" hidden>

        <textarea id="messageInput" rows="1" placeholder="Ask Anything"></textarea>

        <button id="micBtn" class="composer-icon" aria-label="Microphone">
          <svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg>
        </button>

        <button id="cameraBtn" class="composer-icon" aria-label="Camera">
          <svg viewBox="0 0 24 24"><path d="M4 7h4l1.5-2h5L16 7h4v12H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
        </button>

        <button id="sendBtn" class="send-btn" aria-label="Send">
          <svg viewBox="0 0 24 24"><path d="M4 4l16 8-16 8 3-8zM7 12h13"/></svg>
        </button>

      </div>
    </footer>

    <input id="cameraInput" type="file" accept="image/*" capture="environment" hidden>

  </div>

  <script src="app.js"></script>
</body>
</html>
